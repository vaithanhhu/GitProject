<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid - SASS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="main-container">

        <div class="grid-container">

            <div class="grid-wrapper header-wrapper">
                <div class="grid-content header-content"></div>
            </div>

            <div class="grid-wrapper content-wrapper">

                <div class="grid-content sidebar-content">
                    <div class="blue-block"></div>
                    <div class="blue-block"></div>
                    <div class="blue-block"></div>
                    <div class="blue-block"></div>
                </div>

                <div class="grid-content empty-content"></div>
                <div class="grid-content empty-content"></div>
                <div class="grid-content empty-content"></div>
                <div class="grid-content empty-content"></div>
                <div class="grid-content empty-content"></div>
                <div class="grid-content empty-content"></div>

                <div class="grid-content right-content">
                    <div class="large-blue-block"></div>
                </div>

            </div>

            <div class="grid-wrapper footer-wrapper">
                <div class="grid-content footer-content"></div>
            </div>

        </div>

        <div class="grid-container grid-overlay">
            <div class="grid-wrapper overlay-wrapper">

                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>
                <div class="grid-content overlay-column"></div>

            </div>
        </div>

    </div>

    <p class="description">
        Resize the browser window to see that this grid will respond
        to the resizing, and always use 100% of the available space.
    </p>

</body>
</html>
