<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        .nav a:hover {
            color: yellow;
        }

        .main-container {
            display: flex;
            flex: 1;
        }

        .content {
            flex: 3;
            padding: 20px;
        }

        .sidebar {
            flex: 1;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                text-align: center;
            }

            .nav a {
                margin: 10px 0;
            }

            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Responsive Flexbox</h1>
        </header>

        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </nav>

        <div class="main-container">

            <main class="content">
                <h2>Main Content</h2>
                <p>
                    Đây là khu vực nội dung chính của trang web.
                    Bố cục sử dụng CSS Flexbox và có khả năng
                    responsive trên cả desktop và mobile.
                </p>
            </main>

            <aside class="sidebar">
                <h2>Sidebar</h2>
                <p>Tin tức</p>
                <p>Quảng cáo</p>
                <p>Liên kết</p>
            </aside>

        </div>

        <footer class="footer">
            <p>Copyright © 2026 - Responsive Flexbox</p>
        </footer>

    </div>

</body>
</html>
