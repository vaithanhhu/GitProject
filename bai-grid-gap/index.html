<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Grid Gap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            /* Khoảng cách giữa hàng và cột */
            grid-gap: 30px 20px;

            width: 80%;
            margin: 30px auto;
        }

        .item {
            background-color: lightblue;
            border: 1px solid #333;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>grid-gap</h1>

    <div class="grid">
        <div class="item">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

</body>
</html>
