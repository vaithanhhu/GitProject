<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS - grid-row-gap</title>

    <style>
        .grid-container {
            display: grid;
            grid-template-columns: auto auto auto;
            grid-row-gap: 30px;
            background-color: lightblue;
            padding: 10px;
        }

        .grid-container > div {
            background-color: white;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Ví dụ sử dụng grid-row-gap</h2>

    <div class="grid-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

</body>
</html>
