<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lịch họp công ty</title>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp phòng Kinh doanh</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng Nhân sự</td>
        </tr>

        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">09:00 - 12:00: Họp toàn công ty</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>08:30 - 09:30</td>
            <td>Họp phòng Kỹ thuật</td>
        </tr>

        <tr>
            <td>15:00 - 16:00</td>
            <td>Họp ban giám đốc</td>
        </tr>

    </table>

</body>
</html>
