<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header, .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .nav {
            background-color: #444;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .main-container {
            display: flex;
            flex: 1;
        }

        .content {
            flex: 3;
            padding: 20px;
        }

        .sidebar {
            flex: 1;
            background-color: #f4f4f4;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            Header
        </header>

        <nav class="nav">
            Navigation
        </nav>

        <div class="main-container">

            <main class="content">
                <h2>Main Content</h2>
                <p>
                    Đây là khu vực nội dung chính của trang web.
                    Bố cục được xây dựng bằng CSS Flexbox.
                </p>
            </main>

            <aside class="sidebar">
                <h2>Sidebar</h2>
                <p>Tin tức</p>
                <p>Quảng cáo</p>
                <p>Liên kết</p>
            </aside>

        </div>

        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
