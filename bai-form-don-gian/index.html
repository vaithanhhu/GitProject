<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form đơn giản</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 250px;
            padding: 6px;
            margin-bottom: 10px;
        }

        .hobby {
            margin-left: 120px;
            margin-bottom: 15px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- PHẦN 1 -->
    <div class="form-container">

        <h2>THÔNG TIN CÁ NHÂN</h2>

        <form method="get" action="#">

            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname">
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br>

            <label>Sở thích:</label>

            <div class="hobby">
                <input type="checkbox" name="hobby" value="reading">
                Đọc sách
                <br>

                <input type="checkbox" name="hobby" value="music">
                Nghe nhạc
                <br>

                <input type="checkbox" name="hobby" value="sports">
                Thể thao
                <br>

                <input type="checkbox" name="hobby" value="travel">
                Du lịch
            </div>

            <div class="buttons">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>

        </form>

    </div>


    <!-- PHẦN 2 -->
    <div class="form-container">

        <h2>ĐĂNG KÝ HỌC VIÊN</h2>

        <form method="get" action="#">

            <label for="studentName">Họ và tên:</label>
            <input type="text" id="studentName" name="studentName">
            <br>

            <label for="emailStudent">Email:</label>
            <input type="email" id="emailStudent" name="emailStudent">
            <br>

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password">
            <br>

            <label for="birthday">Ngày sinh:</label>
            <input type="date" id="birthday" name="birthday">
            <br>

            <label for="gender">Giới tính:</label>
            <select id="gender" name="gender">
                <option value="male">Nam</option>
                <option value="female">Nữ</option>
                <option value="other">Khác</option>
            </select>
            <br>

            <label for="course">Khóa học:</label>
            <select id="course" name="course">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
            </select>
            <br>

            <label for="phone">Số điện thoại:</label>
            <input type="text" id="phone" name="phone">
            <br>

            <div class="buttons">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>

        </form>

    </div>

</body>
</html>
