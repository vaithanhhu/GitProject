<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid và Flexbox</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Bước 1: Grid 3 cột + Flexbox -->
    <div class="container mt-5">

        <div class="row">

            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="mb-0">Phần 1</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white">
                <p class="mb-0">Phần 2</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="mb-0">Phần 3</p>
            </div>

        </div>

    </div>


    <!-- Bước 2: Margin và Padding -->
    <div class="container my-5 py-3">

        <h3 class="text-center">
            Khoảng cách được điều chỉnh bằng Margin & Padding
        </h3>

    </div>


    <!-- Bước 3: Display Property -->
    <div class="d-none d-md-block bg-warning text-center p-3">

        <p class="mb-0">
            Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px
        </p>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
